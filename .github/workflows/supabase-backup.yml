name: Supabase Backup (2 em 2 horas)

# Backup completo dos dados via API REST (HTTPS) — NÃO usa pg_dump nem senha de
# banco (que no plano grátis exige conexão IPv6, incompatível com o GitHub Actions).
# Exporta cada tabela como JSON (paginado), gzip, e commita num repo PRIVADO
# separado (rottas-backups). Mantém 30 dias. O schema fica versionado nas
# migrations supabase_migration_v*.sql do próprio rottas-app.
#
# SECRETS necessários (Settings > Secrets and variables > Actions):
#   SUPABASE_SERVICE_KEY = service_role key (Supabase > Settings > API)
#   BACKUP_REPO_TOKEN    = PAT fine-grained com Contents:write em rottas-backups
# (o antigo SUPABASE_DB_URL não é mais usado — pode apagar.)

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Verifica secrets
        id: chk
        env:
          SVC: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: |
          if [ -z "$SVC" ] || [ -z "$TOKEN" ]; then
            echo "Faltam secrets (SUPABASE_SERVICE_KEY e/ou BACKUP_REPO_TOKEN) — pulando."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Exporta tabelas (REST/HTTPS, paginado)
        if: steps.chk.outputs.ok == 'true'
        env:
          SVC: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          REF=lmzjlirzexyopnjxohez
          BASE="https://$REF.supabase.co/rest/v1"
          TS=$(date -u +%Y%m%d-%H%M)
          OUT="out/$TS"
          mkdir -p "$OUT"
          # Lista de tabelas (atualize se criar tabelas novas)
          TABLES="agendamentos app_settings atividades cidades clientes corretores dashboard_snapshots empreendimentos gerentes_house imobiliarias locais_visita motivos_dwv motivos_orulo motivos_visita profiles visitas_imports"
          for t in $TABLES; do
            offset=0
            : > "$OUT/$t.ndjson"
            while : ; do
              resp=$(curl -s "$BASE/$t?select=*&limit=1000&offset=$offset" \
                -H "apikey: $SVC" -H "Authorization: Bearer $SVC")
              cnt=$(echo "$resp" | jq 'length')
              echo "$resp" | jq -c '.[]' >> "$OUT/$t.ndjson"
              if [ "$cnt" -lt 1000 ]; then break; fi
              offset=$((offset+1000))
            done
            jq -s '.' "$OUT/$t.ndjson" > "$OUT/$t.json"
            rm "$OUT/$t.ndjson"
            echo "  $t: $(jq 'length' "$OUT/$t.json") registros"
          done
          gzip "$OUT"/*.json
          echo "TS=$TS" >> "$GITHUB_ENV"

      - name: Envia para rottas-backups
        if: steps.chk.outputs.ok == 'true'
        env:
          TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:$TOKEN@github.com/gandradesg/rottas-backups.git" repo
          mkdir -p "repo/dumps"
          cp -r "out/$TS" "repo/dumps/"
          cd repo
          find dumps -name '*.gz' -mtime +30 -delete
          git config user.name "backup-bot"
          git config user.email "backup@rottasconstrutora.com.br"
          git add -A
          git commit -m "backup $TS" || { echo "sem mudancas"; exit 0; }
          git push
