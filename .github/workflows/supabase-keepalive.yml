name: Supabase Keep-Alive

# Mantem o projeto Supabase (plano gratuito) ativo, evitando a pausa
# automatica que ocorre apos 7 dias sem atividade no banco.
# Chama a funcao public.ping() via REST diariamente.
# Roda na infraestrutura do GitHub (nao depende de nenhum PC ligado).
# A anon key abaixo e PUBLICA por design (ja vai no frontend, protegida por RLS).

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          echo "Pingando Supabase em $(date -u)"
          ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxtempsaXJ6ZXh5b3BuanhvaGV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2NzExMjcsImV4cCI6MjA5MzI0NzEyN30.V23FCvrJKRkGhjmZQqAnaXYLbtpMw7Wc_Ae7UB0t7a8"
          RESP=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" \
            -X POST "https://lmzjlirzexyopnjxohez.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: $ANON" \
            -H "Authorization: Bearer $ANON" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "$RESP"
          STATUS=$(echo "$RESP" | grep -o 'HTTP_STATUS:[0-9]*' | cut -d: -f2)
          if [ "$STATUS" != "200" ]; then
            echo "::error::Ping falhou (HTTP $STATUS)"
            exit 1
          fi
          echo "Ping OK (HTTP $STATUS) - Supabase ativo."
